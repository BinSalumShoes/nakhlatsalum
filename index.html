<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- MUONEKANO WA KIKOKOTOO (KIINI MACHO) --- */
        #calculatorScreen {
            width: 100%;
            max-width: 360px;
            padding: 20px;
        }
        .calc-display {
            width: 100%;
            height: 90px;
            background: #000;
            color: #fff;
            font-size: 48px;
            text-align: right;
            padding: 15px;
            border: none;
            outline: none;
            margin-bottom: 15px;
            overflow-x: auto;
        }
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .calc-btn {
            height: 70px;
            border-radius: 50%;
            border: none;
            font-size: 26px;
            font-weight: 500;
            cursor: pointer;
            background-color: #333333;
            color: #ffffff;
            transition: 0.1s;
        }
        .calc-btn:active {
            opacity: 0.7;
        }
        .btn-top {
            background-color: #a5a5a5;
            color: #000000;
        }
        .btn-op {
            background-color: #ff9f0a;
            color: #ffffff;
        }
        .btn-zero {
            grid-column: span 2;
            border-radius: 35px;
            text-align: left;
            padding-left: 28px;
        }

        /* --- MUONEKANO WA VAULT YA SIRI --- */
        #vaultScreen {
            display: none;
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            background-color: #121212;
            padding: 20px;
        }
        .vault-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
            margin-bottom: 20px;
        }
        .vault-header h2 {
            font-size: 20px;
            color: #ff9f0a;
        }
        .btn-lock {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-upload {
            display: block;
            width: 100%;
            background-color: #ff9f0a;
            color: #000;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: none;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            display: block;
        }
        .delete-btn {
            width: 100%;
            background-color: #2a2a2a;
            color: #ff6b6b;
            border: none;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .empty-msg {
            text-align: center;
            color: #777;
            grid-column: 1 / -1;
            padding: 40px 0;
        }
    </style>
</head>
<body>

    <!-- 1. KIKOKOTOO CHA KAWAIDA (KIINI MACHO) -->
    <div id="calculatorScreen">
        <input type="text" class="calc-display" id="display" value="0" readonly>
        <div class="calc-grid">
            <button class="calc-btn btn-top" onclick="clearDisplay()">AC</button>
            <button class="calc-btn btn-top" onclick="deleteLast()">⌫</button>
            <button class="calc-btn btn-top" onclick="appendValue('%')">%</button>
            <button class="calc-btn btn-op" onclick="appendValue('/')">÷</button>

            <button class="calc-btn" onclick="appendValue('7')">7</button>
            <button class="calc-btn" onclick="appendValue('8')">8</button>
            <button class="calc-btn" onclick="appendValue('9')">9</button>
            <button class="calc-btn btn-op" onclick="appendValue('*')">×</button>

            <button class="calc-btn" onclick="appendValue('4')">4</button>
            <button class="calc-btn" onclick="appendValue('5')">5</button>
            <button class="calc-btn" onclick="appendValue('6')">6</button>
            <button class="calc-btn btn-op" onclick="appendValue('-')">−</button>

            <button class="calc-btn" onclick="appendValue('1')">1</button>
            <button class="calc-btn" onclick="appendValue('2')">2</button>
            <button class="calc-btn" onclick="appendValue('3')">3</button>
            <button class="calc-btn btn-op" onclick="appendValue('+')">+</button>

            <button class="calc-btn btn-zero" onclick="appendValue('0')">0</button>
            <button class="calc-btn" onclick="appendValue('.')">.</button>
            <button class="calc-btn btn-op" onclick="calculate()">=</button>
        </div>
    </div>

    <!-- 2. VAULT YA SIRI (INAFUNGUKA UKIWEKA PIN + =) -->
    <div id="vaultScreen">
        <div class="vault-header">
            <h2>🔒 Picha Zangu za Siri</h2>
            <button class="btn-lock" onclick="lockVault()">Funga (Lock)</button>
        </div>

        <label for="imageInput" class="btn-upload">+ Ficha Picha Mpya Hapa</label>
        <input type="file" id="imageInput" accept="image/*" multiple>

        <div class="gallery" id="gallery"></div>
    </div>

    <script>
        const SECRET_PIN = "1234"; // Badili hii iwe namba yako ya siri
        const display = document.getElementById('display');
        const calculatorScreen = document.getElementById('calculatorScreen');
        const vaultScreen = document.getElementById('vaultScreen');
        const imageInput = document.getElementById('imageInput');
        const gallery = document.getElementById('gallery');

        let photos = JSON.parse(localStorage.getItem('secret_calc_photos')) || [];

        // --- KAZI ZA KIKOKOTOO ---
        function appendValue(val) {
            if (display.value === "0" || display.value === "Error") {
                display.value = val;
            } else {
                display.value += val;
            }
        }

        function clearDisplay() {
            display.value = "0";
        }

        function deleteLast() {
            if (display.value.length > 1) {
                display.value = display.value.slice(0, -1);
            } else {
                display.value = "0";
            }
        }

        function calculate() {
            // Angalia kama aliyeandika ameingiza PIN ya siri
            if (display.value === SECRET_PIN) {
                openVault();
                return;
            }

            // Kama siyo PIN, fanya hesabu ya kawaida
            try {
                let result = eval(display.value);
                display.value = result;
            } catch (e) {
                display.value = "Error";
            }
        }

        // --- KAZI ZA VAULT YA SIRI ---
        function openVault() {
            display.value = "0";
            calculatorScreen.style.display = "none";
            vaultScreen.style.display = "block";
            document.body.style.alignItems = "flex-start";
            renderGallery();
        }

        function lockVault() {
            vaultScreen.style.display = "none";
            calculatorScreen.style.display = "block";
            document.body.style.alignItems = "center";
            display.value = "0";
        }

        imageInput.addEventListener('change', function(e) {
            const files = e.target.files;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    photos.push({
                        id: Date.now() + Math.random(),
                        src: event.target.result
                    });
                    saveAndRender();
                };
                reader.readAsDataURL(file);
            }
            imageInput.value = '';
        });

        function deletePhoto(id) {
            if (confirm("Futa picha hii kabisa?")) {
                photos = photos.filter(p => p.id !== id);
                saveAndRender();
            }
        }

        function saveAndRender() {
            try {
                localStorage.setItem('secret_calc_photos', JSON.stringify(photos));
            } catch (e) {
                alert("Nafasi ya kuhifadhi imejaa! Futa baadhi ya picha.");
            }
            renderGallery();
        }

        function renderGallery() {
            gallery.innerHTML = '';
            if (photos.length === 0) {
                gallery.innerHTML = '<div class="empty-msg">Hakuna picha iliyofichwa bado.<br>Bonyeza kitufe cha njano hapo juu kuongeza.</div>';
                return;
            }
            photos.forEach(photo => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${photo.src}" alt="Secret">
                    <button class="delete-btn" onclick="deletePhoto(${photo.id})">Futa Picha</button>
                `;
                gallery.appendChild(card);
            });
        }
    </script>
</body>
</html>
