<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kificha Picha (Photo Vault)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            color: #f5b942;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .btn-upload {
            background-color: #f5b942;
            color: #000;
        }
        .btn-toggle-vault {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
        }
        .btn-toggle-vault.active {
            background-color: #d9534f;
            border-color: #d9534f;
        }
        input[type="file"] {
            display: none;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
        .card-actions {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            background-color: #252525;
        }
        .action-btn {
            padding: 6px 10px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .hide-btn {
            background-color: #0275d8;
            color: white;
        }
        .unhide-btn {
            background-color: #5cb85c;
            color: white;
        }
        .delete-btn {
            background-color: #d9534f;
            color: white;
        }
        .empty-msg {
            text-align: center;
            color: #888;
            grid-column: 1 / -1;
            padding: 30px 0;
        }
        /* PIN Modal */
        #pinModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            border: 1px solid #444;
        }
        .modal-box input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #555;
            background: #121212;
            color: #fff;
            font-size: 18px;
            text-align: center;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="pageTitle">Picha Zangu (Zinazoonekana)</h1>
    </header>

    <div class="controls">
        <label for="imageInput" class="btn btn-upload">+ Ongeza Picha Mpya</label>
        <input type="file" id="imageInput" accept="image/*" multiple>

        <button id="toggleVaultBtn" class="btn btn-toggle-vault" onclick="handleVaultToggle()">
            🔒 Fungua Picha Zilizofichwa
        </button>
    </div>

    <div class="gallery" id="gallery"></div>

    <!-- Modal ya kuingiza PIN -->
    <div id="pinModal">
        <div class="modal-box">
            <h3 id="modalTitle">Ingiza PIN ya Siri</h3>
            <p style="font-size: 13px; color: #aaa; margin-top: 5px;" id="modalDesc">PIN ya mwanzo ni: 1234</p>
            <input type="password" id="pinInput" maxlength="4" placeholder="****">
            <div style="display: flex; gap: 10px;">
                <button class="btn" style="flex:1; background:#444; color:#fff;" onclick="closeModal()">Ghairi</button>
                <button class="btn btn-upload" style="flex:1;" onclick="verifyPin()">Ingia</button>
            </div>
        </div>
    </div>

    <script>
        let photos = JSON.parse(localStorage.getItem('vault_photos')) || [];
        let viewingHidden = false;
        const SECRET_PIN = "1234"; // Unaweza kubadili namba hii ya siri

        const imageInput = document.getElementById('imageInput');
        const gallery = document.getElementById('gallery');
        const toggleVaultBtn = document.getElementById('toggleVaultBtn');
        const pageTitle = document.getElementById('pageTitle');

        // Kupakia picha mpya
        imageInput.addEventListener('change', function(e) {
            const files = e.target.files;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    photos.push({
                        id: Date.now() + Math.random(),
                        src: event.target.result,
                        hidden: viewingHidden // Kama yupo kwenye vault, picha inafichwa moja kwa moja
                    });
                    saveAndRender();
                };
                reader.readAsDataURL(file);
            }
            imageInput.value = '';
        });

        // Kubadili hali ya picha (Hide / Unhide)
        function toggleHide(id) {
            photos = photos.map(photo => {
                if (photo.id === id) {
                    return { ...photo, hidden: !photo.hidden };
                }
                return photo;
            });
            saveAndRender();
        }

        // Kufuta picha
        function deletePhoto(id) {
            if (confirm("Una uhakika unataka kufuta picha hii kabisa?")) {
                photos = photos.filter(photo => photo.id !== id);
                saveAndRender();
            }
        }

        // Kufungua au kufunga sehemu ya siri
        function handleVaultToggle() {
            if (viewingHidden) {
                viewingHidden = false;
                updateUI();
            } else {
                document.getElementById('pinInput').value = '';
                document.getElementById('pinModal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('pinModal').style.display = 'none';
        }

        function verifyPin() {
            const entered = document.getElementById('pinInput').value;
            if (entered === SECRET_PIN) {
                closeModal();
                viewingHidden = true;
                updateUI();
            } else {
                alert("PIN uliyoingiza si sahihi!");
            }
        }

        function updateUI() {
            if (viewingHidden) {
                pageTitle.innerText = "🔒 Picha Zilizofichwa (Siri)";
                toggleVaultBtn.innerText = "🔓 Rudi Kwenye Picha za Kawaida";
                toggleVaultBtn.classList.add('active');
            } else {
                pageTitle.innerText = "Picha Zangu (Zinazoonekana)";
                toggleVaultBtn.innerText = "🔒 Fungua Picha Zilizofichwa";
                toggleVaultBtn.classList.remove('active');
            }
            renderGallery();
        }

        function saveAndRender() {
            try {
                localStorage.setItem('vault_photos', JSON.stringify(photos));
            } catch (e) {
                alert("Kumbukumbu ya kivinjari imejaa! Futa baadhi ya picha au tumia picha ndogo.");
            }
            renderGallery();
        }

        function renderGallery() {
            gallery.innerHTML = '';
            const filtered = photos.filter(p => p.hidden === viewingHidden);

            if (filtered.length === 0) {
                gallery.innerHTML = `<div class="empty-msg">${viewingHidden ? 'Hakuna picha iliyofichwa bado.' : 'Hakuna picha hapa. Bonyeza "+ Ongeza Picha Mpya" kuanza.'}</div>`;
                return;
            }

            filtered.forEach(photo => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${photo.src}" alt="Picha">
                    <div class="card-actions">
                        <button class="action-btn ${photo.hidden ? 'unhide-btn' : 'hide-btn'}" onclick="toggleHide(${photo.id})">
                            ${photo.hidden ? 'Onyesha (Unhide)' : 'Ficha (Hide)'}
                        </button>
                        <button class="action-btn delete-btn" onclick="deletePhoto(${photo.id})">Futa</button>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        // Anza kuonyesha picha
        renderGallery();
    </script>
</body>
</html>
