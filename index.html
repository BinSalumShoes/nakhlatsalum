<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English - Swahili Dictionary</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* --- MUONEKANO WA KAMUSI --- */
        #dictScreen {
            width: 100%;
            max-width: 420px;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        .dict-title {
            font-size: 22px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 5px;
            text-align: center;
        }
        .dict-subtitle {
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .search-input:focus {
            border-color: #38bdf8;
        }
        .search-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 0 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .search-btn:hover {
            background: #0ea5e9;
        }
        .result-card {
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
            min-height: 120px;
        }
        .result-word {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .result-pos {
            font-size: 12px;
            color: #f43f5e;
            font-style: italic;
            margin-bottom: 8px;
        }
        .result-meaning {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        /* --- MUONEKANO WA VAULT YA SIRI --- */
        #vaultScreen {
            display: none;
            width: 100%;
            max-width: 500px;
            min-height: 90vh;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #334155;
        }
        .vault-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .vault-header h2 {
            font-size: 18px;
            color: #38bdf8;
        }
        .btn-lock {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-upload {
            display: block;
            width: 100%;
            background: #38bdf8;
            color: #0f172a;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.2s;
        }
        input[type="file"] {
            display: none;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            max-height: 65vh;
            overflow-y: auto;
            padding-right: 5px;
        }
        .card {
            background: #0f172a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
        }
        .delete-btn {
            width: 100%;
            background: #1e293b;
            color: #f43f5e;
            border: none;
            padding: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .empty-msg {
            text-align: center;
            color: #64748b;
            grid-column: 1 / -1;
            padding: 30px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 1. UKURASA WA KAMUSI -->
    <div id="dictScreen">
        <div class="dict-title">English - Swahili</div>
        <div class="dict-subtitle">Advanced Offline/Online Dictionary</div>
        
        <div class="search-box">
            <input type="text" id="wordInput" class="search-input" placeholder="Andika neno kutafuta...">
            <button class="search-btn" onclick="searchWord()">Tafuta</button>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-word" id="resWord">Karibu</div>
            <div class="result-pos" id="resPos">nomino [noun]</div>
            <div class="result-meaning" id="resMeaning">Andika neno lolote la Kiingereza ili kupata maana yake kwa urahisi.</div>
        </div>
    </div>

    <!-- 2. VAULT YA SIRI -->
    <div id="vaultScreen">
        <div class="vault-header">
            <h2>🔒 Picha Zangu za Siri</h2>
            <button class="btn-lock" onclick="lockVault()">Funga</button>
        </div>

        <label for="imageInput" class="btn-upload">+ Weka Picha Mpya</label>
        <input type="file" id="imageInput" accept="image/*" multiple>

        <div class="gallery" id="gallery"></div>
    </div>

    <script>
        const SECRET_CODE = "1234"; // Namba yako ya siri ya kufungua picha

        const wordInput = document.getElementById('wordInput');
        const resWord = document.getElementById('resWord');
        const resPos = document.getElementById('resPos');
        const resMeaning = document.getElementById('resMeaning');
        
        const dictScreen = document.getElementById('dictScreen');
        const vaultScreen = document.getElementById('vaultScreen');
        const imageInput = document.getElementById('imageInput');
        const gallery = document.getElementById('gallery');

        let photos = JSON.parse(localStorage.getItem('dict_vault_photos')) || [];

        wordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchWord();
            }
        });

        async function searchWord() {
            let query = wordInput.value.trim().toLowerCase();

            if (query === "") return;

            // 1. ANGALIA KAMA AMEINGIZA KODI YA SIRI YA VAULT
            if (query === SECRET_CODE) {
                openVault();
                return;
            }

            // 2. TAFUTA KUPITIA MTANDAO ILI NENO LOLOTE LIONEKANE
            resWord.innerText = "Inatafuta...";
            resPos.innerText = "...";
            resMeaning.innerText = "Tafadhali subiri kidogo...";

            try {
                let response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${query}`);
                if (!response.ok) {
                    throw new Error("Neno halikupatikana");
                }
                let data = await response.json();
                
                let wordInfo = data[0];
                let meaningObj = wordInfo.meanings[0];
                let definition = meaningObj.definitions[0].definition;
                let partOfSpeech = meaningObj.partOfSpeech || "neno";

                resWord.innerText = wordInfo.word;
                resPos.innerText = `aina: ${partOfSpeech}`;
                resMeaning.innerText = definition;

            } catch (error) {
                resWord.innerText = query;
                resPos.innerText = "haijulikani [unknown]";
                resMeaning.innerText = "Samahani, neno hili halikupatikana kwenye hifadhi au halina maana sahihi ya Kiingereza.";
            }
        }

        // --- KAZI ZA VAULT YA SIRI ---
        function openVault() {
            wordInput.value = "";
            dictScreen.style.display = "none";
            vaultScreen.style.display = "block";
            renderGallery();
        }

        function lockVault() {
            vaultScreen.style.display = "none";
            dictScreen.style.display = "block";
            wordInput.value = "";
            resWord.innerText = "Karibu";
            resPos.innerText = "nomino [noun]";
            resMeaning.innerText = "Andika neno lolote la Kiingereza ili kupata maana yake kwa urahisi.";
        }

        imageInput.addEventListener('change', function(e) {
            const files = e.target.files;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    photos.push({
                        id: Date.now() + Math.random(),
                        src: event.target.result
                    });
                    saveAndRender();
                };
                reader.readAsDataURL(file);
            }
            imageInput.value = '';
        });

        function deletePhoto(id) {
            if (confirm("Futa picha hii?")) {
                photos = photos.filter(p => p.id !== id);
                saveAndRender();
            }
        }

        function saveAndRender() {
            try {
                localStorage.setItem('dict_vault_photos', JSON.stringify(photos));
            } catch (e) {
                alert("Kumbukumbu imejaa! Futa baadhi ya picha.");
            }
            renderGallery();
        }

        function renderGallery() {
            gallery.innerHTML = '';
            if (photos.length === 0) {
                gallery.innerHTML = '<div class="empty-msg">Hakuna picha iliyofichwa bado.</div>';
                return;
            }
            photos.forEach(photo => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${photo.src}" alt="Vault Image">
                    <button class="delete-btn" onclick="deletePhoto(${photo.id})">Futa</button>
                `;
                gallery.appendChild(card);
            });
        }
    </script>
</body>
</html>
