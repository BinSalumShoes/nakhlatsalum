<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Me a Message</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333333;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #666666;
            font-weight: bold;
        }
        textarea, input[type="email"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #7360f2; /* Viber color accent */
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #5d49d6;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Send Me a Direct Message</h2>
    <!-- Replace 'YOUR_FORM_ID' with your actual Formspree ID -->
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <label for="email">Your Email (optional):</label>
        <input type="email" id="email" name="reply_to" placeholder="name@example.com">

        <label for="message">Your Message:</label>
        <textarea id="message" name="message" rows="5" placeholder="Write anything here..." required></textarea>

        <button type="submit">Send Message</button>
    </form>
</div>

</body>
</html>
