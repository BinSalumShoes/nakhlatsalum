<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man: Web Runner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #111;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- MUONEKANO WA MCHEZO WA SPIDER-MAN --- */
        #gameScreen {
            width: 100%;
            max-width: 400px;
            height: 90vh;
            background: linear-gradient(135deg, #8b0000, #1a0000);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.3);
            border: 2px solid #ff4d4d;
            position: relative;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .game-title {
            font-size: 20px;
            font-weight: 900;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* KITUFE CHA SIRI CHA KUFUNGUA VAULT (Kimefichwa kwenye alama ndogo) */
        .secret-trigger {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            font-size: 18px;
            cursor: pointer;
        }
        .game-board {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }
        .spidey-icon {
            font-size: 60px;
            animation: bounce 1.5s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }
        .score-board {
            font-size: 18px;
            margin-top: 10px;
            color: #00ffff;
        }
        .btn-play {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(255, 77, 77, 0.4);
            transition: 0.2s;
        }
        .btn-play:active {
            transform: scale(0.95);
        }

        /* --- MUONEKANO WA VAULT YA SIRI --- */
        #vaultScreen {
            display: none;
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 20px;
            border: 2px solid #ffd700;
            flex-direction: column;
        }
        .vault-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .vault-header h2 {
            font-size: 18px;
            color: #ffd700;
        }
        .btn-lock {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-upload {
            display: block;
            width: 100%;
            background: #ffd700;
            color: #000;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }
        input[type="file"] {
            display: none;
        }
        .gallery {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .card {
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            display: block;
        }
        .delete-btn {
            width: 100%;
            background: #222;
            color: #ff4d4d;
            border: none;
            padding: 5px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .empty-msg {
            text-align: center;
            color: #777;
            grid-column: 1 / -1;
            padding: 40px 0;
        }

        /* Modal ya kuingiza PIN ya Vault */
        #pinModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            width: 80%;
            max-width: 280px;
            text-align: center;
            border: 1px solid #ffd700;
        }
        .modal-box input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            font-size: 20px;
            text-align: center;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>

    <!-- 1. SEHEMU YA MCHEZO WA SPIDER-MAN -->
    <div id="gameScreen">
        <div class="game-header">
            <span class="game-title">🕷️ Spidey Web Runner</span>
            <!-- Ukibonyeza hapa kwenye kitufe hiki kidogo cha siri, italeta sehemu ya kuweka PIN -->
            <button class="secret-trigger" onclick="promptPin()">⚙️</button>
        </div>

        <div class="game-board">
            <div class="spidey-icon">🦸‍♂️</div>
            <div class="score-board">Alama: <span id="score">0</span></div>
            <p style="font-size: 12px; color: #aaa; margin-top: 15px; text-align: center;">Bonyeza kitufe chini kuruka majengo na kukusanya sarafu!</p>
        </div>

        <button class="btn-play" onclick="playGame()">Ruka (Jump)</button>
    </div>

    <!-- 2. VAULT YA SIRI -->
    <div id="vaultScreen">
        <div class="vault-header">
            <h2>🔒 Picha Zangu za Siri</h2>
            <button class="btn-lock" onclick="lockVault()">Rudi Kwenye Mchezo</button>
        </div>

        <label for="imageInput" class="btn-upload">+ Ficha Picha Mpya</label>
        <input type="file" id="imageInput" accept="image/*" multiple>

        <div class="gallery" id="gallery"></div>
    </div>

    <!-- Modal ya PIN -->
    <div id="pinModal">
        <div class="modal-box">
            <h3 style="color: #ffd700; font-size: 16px;">Weka PIN ya Siri</h3>
            <input type="password" id="pinInput" maxlength="4" placeholder="****">
            <div style="display: flex; gap: 8px;">
                <button class="btn-play" style="flex:1; padding: 8px; font-size: 14px; background:#444;" onclick="closeModal()">Ghairi</button>
                <button class="btn-play" style="flex:1; padding: 8px; font-size: 14px;" onclick="verifyPin()">Ingia</button>
            </div>
        </div>
    </div>

    <script>
        const SECRET_PIN = "1234"; // Badili iwe namba yako ya siri
        let score = 0;

        const gameScreen = document.getElementById('gameScreen');
        const vaultScreen = document.getElementById('vaultScreen');
        const pinModal = document.getElementById('pinModal');
        const pinInput = document.getElementById('pinInput');
        const scoreDisplay = document.getElementById('score');
        const imageInput = document.getElementById('imageInput');
        const gallery = document.getElementById('gallery');

        let photos = JSON.parse(localStorage.getItem('spidey_vault_photos')) || [];

        // Mantiki ya mchezo
        function playGame() {
            score += 10;
            scoreDisplay.innerText = score;
        }

        // Kufungua modal ya PIN ya siri
        function promptPin() {
            pinInput.value = "";
            pinModal.style.display = 'flex';
        }

        function closeModal() {
            pinModal.style.display = 'none';
        }

        function verifyPin() {
            if (pinInput.value === SECRET_PIN) {
                closeModal();
                gameScreen.style.display = 'none';
                vaultScreen.style.display = 'flex';
                renderGallery();
            } else {
                alert("PIN si sahihi!");
                pinInput.value = "";
            }
        }

        function lockVault() {
            vaultScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
        }

        // Kusimamia picha za Vault
        imageInput.addEventListener('change', function(e) {
            const files = e.target.files;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    photos.push({
                        id: Date.now() + Math.random(),
                        src: event.target.result
                    });
                    saveAndRender();
                };
                reader.readAsDataURL(file);
            }
            imageInput.value = '';
        });

        function deletePhoto(id) {
            if (confirm("Futa picha hii?")) {
                photos = photos.filter(p => p.id !== id);
                saveAndRender();
            }
        }

        function saveAndRender() {
            try {
                localStorage.setItem('spidey_vault_photos', JSON.stringify(photos));
            } catch (e) {
                alert("Nafasi imejaa!");
            }
            renderGallery();
        }

        function renderGallery() {
            gallery.innerHTML = '';
            if (photos.length === 0) {
                gallery.innerHTML = '<div class="empty-msg">Hakuna picha zilizofichwa bado.</div>';
                return;
            }
            photos.forEach(photo => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${photo.src}" alt="Vault">
                    <button class="delete-btn" onclick="deletePhoto(${photo.id})">Futa</button>
                `;
                gallery.appendChild(card);
            });
        }
    </script>
</body>
</html>
